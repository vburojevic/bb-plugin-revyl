name: Tasklet
options:
  bundleIdPrefix: dev.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: Tasklet
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tasklet:
    type: application
    platform: iOS
    sources: [Tasklet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.tasklet
        TARGETED_DEVICE_FAMILY: "1"
